plugins {
    id 'com.android.application'
}

android {
    namespace 'cr.poas.aquapoas'
    compileSdk 36

    defaultConfig {
        applicationId 'agua.poas.com'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '2.1.1'
    }

    // Firma de publicación (clave de subida de Google Play). Se toma de variables de entorno
    // para que la clave nunca quede en el repositorio. Sin ellas, el AAB/APK de release sale sin firmar.
    def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        if (ksPath && file(ksPath).exists()) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath && file(ksPath).exists()) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Datos editables del observatorio (capas, calidad, gobernanza, actividades):
// se publican en el sitio (datos-agua/) y se incluye una copia en la app para uso sin conexión.
tasks.register('copyDatosAgua', Sync) {
    from(rootProject.file('../datos-agua')) { include '*.json' }
    into layout.projectDirectory.dir('src/main/assets/app/data')
}
preBuild.dependsOn 'copyDatosAgua'
