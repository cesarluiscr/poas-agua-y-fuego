name: APK Android — Observatorio del Agua

on:
  push:
    paths:
      - 'android/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'img/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/observatorio-agua-poas.apk
          ls -lh dist

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-agua-poas-apk
          path: dist/observatorio-agua-poas.apk
          retention-days: 30
